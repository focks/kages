name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do, description: "Describe the problem before the solution." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help, description: "Include alternatives you considered." }
