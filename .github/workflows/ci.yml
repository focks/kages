# The same checks a contributor runs locally, plus a proof that the bundled CLI works on Node
# versions without TypeScript support.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The design-system build is deterministic: a dirty tree afterwards means a generated file was not committed.
      - run: npm run build:ds
      - run: git diff --exit-code
      - run: npm run check:plugins
      - run: npm audit --omit=dev --audit-level=high
  # The browser tests skip without KAGES_TEST_URL, and they need real storage: the in-memory
  # store is not shared between routes under Next, so a Kage created by one is missing in the next.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: kages, POSTGRES_DB: kages }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:kages@localhost:5432/kages
      KAGES_TEST_URL: http://localhost:3000
      KAGES_CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18, cache: npm }
      - run: npm ci
      - run: npm run db:setup
      - run: sudo apt-get install -y poppler-utils
      # A dev server, not `next start`: production mode refuses the anonymous writes these tests make.
      - run: npx next dev -p 3000 &
      - run: curl -s -o /dev/null --retry 30 --retry-connrefused --retry-delay 2 "$KAGES_TEST_URL/render"
      - run: npm test
  cli-bundle:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [18, 20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run build:cli
      - run: node dist/kages.mjs --version
      - run: node dist/kages.mjs validate public/ds/ops-console.kage.json
      - run: node dist/kages.mjs install --dry-run --providers claude
