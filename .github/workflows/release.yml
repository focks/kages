# Release workflow. Publishing to npm needs "private": false in
# package.json and an NPM_TOKEN secret; both are the owner's decision.
name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: read, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22.18, registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
