# Archive the tested CLI as a release attachment. Anonymous onboarding uses the
# versioned public/downloads asset shipped with the site, not this release.
name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18, registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm ci
      - run: npm test
      - name: Pack the tested CLI
        run: |
          mkdir -p /tmp/kages-release
          npm pack --pack-destination /tmp/kages-release
      - name: Publish GitHub installation asset
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" /tmp/kages-release/*.tgz --verify-tag --generate-notes
          fi
      - name: Publish to npm when configured
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --provenance --access public
          else
            printf '%s\n' 'npm publishing is not configured; install the tested GitHub release asset.'
          fi
